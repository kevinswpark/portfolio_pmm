<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"label","type":"string","label":"Label","default":"Render test 001"},
    {"id":"line1","type":"string","label":"Headline line 1","default":"HTML in."},
    {"id":"line2","type":"string","label":"Headline line 2","default":"Video out."},
    {"id":"ground","type":"color","label":"Background","default":"#F3EFE6"},
    {"id":"ink","type":"color","label":"Text","default":"#15140F"},
    {"id":"accent","type":"color","label":"Accent","default":"#E8472B"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f3efe6;
        --ink: #15140f;
        --accent: #e8472b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="card"
        data-composition-id="card"
        data-composition-src="compositions/card.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
